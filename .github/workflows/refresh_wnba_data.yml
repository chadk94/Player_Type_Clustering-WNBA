name: Refresh WNBA live data

# NOTE: confirmed 2026-07-07 that GitHub-hosted runners are also blocked by
# stats.nba.com's cloud-IP block (read timeout on every request). The scheduled
# refresh instead runs from a local machine via Windows Task Scheduler
# (refresh_wnba_data.ps1). This workflow is kept manual-only in case that
# changes or you want to re-test from a different runner.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live WNBA data
        run: python fetch_live_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current_season_box.csv todays_matchups.csv
          git diff --cached --quiet || git commit -m "Refresh live WNBA data [skip ci]"
          git push
